name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bluesentra
          POSTGRES_USER: bluesentra
          POSTGRES_PASSWORD: bluesentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bluesentra -d bluesentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_HOST: localhost
      POSTGRES_DB: bluesentra
      POSTGRES_USER: bluesentra
      POSTGRES_PASSWORD: bluesentra
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install system libraries for GeoDjango
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py check
      - run: pytest

  # The frontend job (ESLint, Prettier, tsc --noEmit, Vitest) is added with the frontend scaffold.
