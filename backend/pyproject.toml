[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "PLR0913", "PLR0915", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4          # ADR-004: 4 or fewer parameters preferred
max-statements = 30   # ADR-004: functions around 30 lines

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915"]
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
